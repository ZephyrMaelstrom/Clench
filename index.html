<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#120d10" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="description" content="CLENCH: a five-type rock-paper-scissors roguelite. Shape the odds, then spin." />
    <title>CLENCH</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <style>
      html, body { margin: 0; height: 100%; background: #120d10; overflow: hidden; touch-action: none; }
      body { display: flex; align-items: center; justify-content: center; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100vw; height: 100dvh; }
      canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #f3e7c9; font: 14px monospace; letter-spacing: 4px; }
    </style>
  </head>
  <body>
    <div id="boot">CLENCH</div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
